name: Deploy (documentation stub)

# This workflow intentionally does NOT deploy anything by itself.
#
# Frontend (web/) -> Vercel:
#   Deploys are triggered by Vercel's own GitHub integration once this repo is
#   connected in the Vercel dashboard (Project Settings -> Git). Vercel builds
#   and deploys on every push automatically; no GitHub Actions step is needed
#   or able to fully replace that dashboard-side connection.
#
# Backend + DB (server/) -> Render:
#   Deploys are triggered by Render's GitHub integration the same way, once
#   the service is connected in the Render dashboard. Render's build command
#   should run `npm run build -w server` and its start command
#   `npm run start -w server`, with `npx prisma migrate deploy` run as part of
#   the deploy (Render "Pre-Deploy Command", or the first line of the start
#   command) so schema migrations apply before the new instance takes traffic.
#
# Env vars (JWT secrets, DATABASE_URL, SENTRY_DSN, OAuth credentials, etc.) are
# set in the Vercel/Render dashboards directly and are never committed here.
#
# Full manual setup steps (connecting the repo, setting dashboard env vars,
# configuring the Render PostgreSQL instance) are documented in
# docs/deployment.md by docs-deploy-agent — this file only documents the
# trigger model and hands the rest off to that doc.
#
# This workflow is kept as `workflow_dispatch`-only (manual trigger) so it
# never accidentally runs and no-ops silently on every push. Treat it as
# living documentation, not an active pipeline.
on:
  workflow_dispatch:

jobs:
  reminder:
    name: deployment is dashboard-driven, not GitHub Actions-driven
    runs-on: ubuntu-latest
    steps:
      - name: Print deployment model
        run: |
          echo "Frontend (web/) deploys via Vercel's GitHub integration (Vercel dashboard)."
          echo "Backend (server/) deploys via Render's GitHub integration (Render dashboard)."
          echo "See docs/deployment.md (docs-deploy-agent) for the manual dashboard setup steps."
          echo "This workflow does not perform a deploy — see comments in this file for why."
