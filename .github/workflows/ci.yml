name: CI

# Runs on every push/PR. The web/server/e2e jobs fail the pipeline on any
# failure (lint/typecheck/test/build). The audit job is informational only —
# see its comment below for why.
on:
  push:
  pull_request:

env:
  # Pinned to 24 (not an older LTS) because the installed jsdom/vitest
  # versions (jsdom ^30, vitest ^4.1.10) fail to load under Node 20/22 —
  # qa-tester reproduced `webidl.util.markAsUncloneable is not a function`
  # under Node 20 and confirmed the whole suite (web+server+e2e) passes
  # under 24. Revisit only alongside a deliberate jsdom/vitest version change.
  NODE_VERSION: "24"

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w web

      - name: Typecheck
        run: npm run typecheck -w web

      - name: Unit/component tests
        run: npm run test -w web

      - name: Build
        run: npm run build -w web

  server:
    name: server (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wastewise
          POSTGRES_PASSWORD: wastewise
          POSTGRES_DB: wastewise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wastewise -d wastewise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Matches the postgres service block above — NOT server/.env.test's
      # placeholder credentials (those assume a local Postgres that doesn't
      # exist here). A job-level env var wins over `.env.test` because
      # `dotenv -e .env.test --` (used by `db:push:test`) never overrides an
      # already-set process.env value.
      DATABASE_URL: "postgresql://wastewise:wastewise@localhost:5432/wastewise_test?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w server

      - name: Typecheck
        run: npm run typecheck -w server

      - name: Prisma generate
        run: npm run generate -w server

      - name: Sync test database schema
        run: npm run db:push:test -w server

      - name: Unit/integration tests
        run: npm run test -w server

      - name: Build
        run: npm run build -w server

  audit:
    name: dependency audit (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Reports vulnerabilities but never fails the build. This is a learning
      # project, not a project shipping to production under a security SLA —
      # framework-level vulns (e.g. ones only fixed by a major Next.js bump)
      # aren't worth blocking CI over. Revisit if/when this ships for real.
      - name: Report vulnerabilities (informational only)
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    needs: [web]
    # qa-tester added: e2e/auth.spec.ts drives the real signup/login forms
    # against a real (test-mode) Express API, not just the built web app — so
    # this job now needs its own Postgres service + a running API server,
    # same shape as the `server` job's services block (separate job, so
    # separate ephemeral service container; nothing is shared between jobs).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wastewise
          POSTGRES_PASSWORD: wastewise
          POSTGRES_DB: wastewise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wastewise -d wastewise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
      # Matches the postgres service block above — NOT server/.env.test's
      # placeholder credentials (those assume a local Postgres named
      # "placeholder"/"placeholder", which doesn't exist here). Setting this
      # as a real job-level env var means `dotenv -e .env.test --` (used by
      # `npm run db:push:test`) leaves it alone, since dotenv never overrides
      # an already-set process.env value — same override-avoidance mechanic
      # server/.env.test.local relies on for local dev.
      DATABASE_URL: "postgresql://wastewise:wastewise@localhost:5432/wastewise_test?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prisma generate
        run: npm run generate -w server

      - name: Sync test database schema
        run: npm run db:push:test -w server

      - name: Start API server (test mode)
        # NODE_ENV=test disables authRateLimiter (see
        # server/src/middleware/security.ts) so the e2e suite's several
        # register/login/OAuth-redirect requests don't trip the 10-req/15min
        # limit real traffic gets. Dummy-but-present GOOGLE_*/FACEBOOK_* vars
        # keep isGoogleOAuthConfigured()/isFacebookOAuthConfigured() truthy so
        # the OAuth-button tests exercise a real redirect instead of a 503.
        run: |
          nohup npx dotenv -e .env.test -- npx tsx src/index.ts > /tmp/wastewise-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API server is up"
              exit 0
            fi
            sleep 1
          done
          echo "API server did not become healthy in time"; cat /tmp/wastewise-server.log; exit 1
        working-directory: server
        env:
          NODE_ENV: "test"
          PORT: "4000"
          CLIENT_ORIGIN: "http://localhost:3000"
          JWT_ACCESS_SECRET: "ci-only-access-secret-not-real-000000"
          JWT_REFRESH_SECRET: "ci-only-refresh-secret-not-real-00000"
          GOOGLE_CLIENT_ID: "ci-google-client-id"
          GOOGLE_CLIENT_SECRET: "ci-google-client-secret"
          GOOGLE_CALLBACK_URL: "http://localhost:4000/api/v1/auth/google/callback"
          FACEBOOK_APP_ID: "ci-facebook-app-id"
          FACEBOOK_APP_SECRET: "ci-facebook-app-secret"
          FACEBOOK_CALLBACK_URL: "http://localhost:4000/api/v1/auth/facebook/callback"
          LOG_LEVEL: "silent"

      - name: Build web app
        run: npm run build -w web

      - name: Run e2e tests
        run: npm run test:e2e
