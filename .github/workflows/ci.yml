name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: "24"

jobs:
  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w web

      - name: Typecheck
        run: npm run typecheck -w web

      - name: Build
        run: npm run build -w web

  server:
    name: server (lint, typecheck, build)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w server

      - name: Typecheck
        run: npm run typecheck -w server

      - name: Prisma generate
        run: npm run generate -w server

      - name: Build
        run: npm run build -w server

  audit:
    name: dependency audit (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Report vulnerabilities (informational only)
        continue-on-error: true
        run: npm audit --audit-level=high
